name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&langs_count=8&layout=compact&hide_border=true&title_color=FFB6C1&text_color=666666&bg_color=ffffff
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate personal stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/stats-card.py \
            --kind user \
            --name "${{ github.repository_owner }}" \
            --theme light \
            --out profile/stats.svg

      - name: Generate organization stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/stats-card.py \
            --kind org \
            --name LyraVoid \
            --theme light \
            --out profile/org-stats.svg

      - name: Verify cards
        run: |
          status=0
          for card in profile/stats.svg profile/top-langs.svg profile/org-stats.svg; do
            if [ ! -s "$card" ]; then
              echo "::error file=$card::card was not generated"
              status=1
            elif grep -qiE "something went wrong|could not resolve|not accessible" "$card"; then
              echo "::error file=$card::card contains a renderer error message"
              status=1
            fi
          done
          exit $status

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
