name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Every card is rendered by .github/scripts/stats-card.py, so no third-party
      # service and no personal access token is involved.
      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/stats-card.py --kind user \
            --name "${{ github.repository_owner }}" \
            --orgs "LyraVoid,OnyxZygisk,LyraAgent" \
            --theme blue --out profile/stats.svg
          python3 .github/scripts/stats-card.py --kind org \
            --name LyraVoid \
            --theme blue --out profile/org-stats.svg
          python3 .github/scripts/stats-card.py --kind langs \
            --name "${{ github.repository_owner }}" \
            --theme blue --out profile/top-langs.svg

      - name: Verify cards
        run: |
          status=0
          for card in profile/stats.svg profile/top-langs.svg profile/org-stats.svg; do
            if [ ! -s "$card" ]; then
              echo "::error file=$card::card was not generated"
              status=1
            elif grep -qiE "something went wrong|could not resolve|not accessible" "$card"; then
              echo "::error file=$card::card contains a renderer error message"
              status=1
            fi
          done
          exit $status

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
